modLoader="javafml"
loaderVersion="[2,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/chunkloader/icon.png"
authors="${mod_authors}"
displayURL="https://github.com/ilyasnsir1/Fakeplayer-Chunkloader"
issueTrackerURL="https://github.com/ilyasnsir1/Fakeplayer-Chunkloader/issues"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"


