plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "fakeplayerchunkloader${project.minecraft_version}-fabric"
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

loom {

    enableModProvidedJavadoc = false

    runs {
        client2 {
            client()
            name "Client 2"
            configName "Minecraft Client 2"
            runDir "run2"
            ideConfigGenerated true
            programArg "--username"
            programArg "Player2"
        }
    }
}

dependencies {

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    def lwjglTinyFd = "3.4.3"
    implementation "org.lwjgl:lwjgl-tinyfd:${lwjglTinyFd}"
    include "org.lwjgl:lwjgl-tinyfd:${lwjglTinyFd}"
    ["natives-windows", "natives-windows-arm64", "natives-linux", "natives-linux-arm64", "natives-macos", "natives-macos-arm64"].each { classifier ->
        runtimeOnly "org.lwjgl:lwjgl-tinyfd:${lwjglTinyFd}:${classifier}"
        include "org.lwjgl:lwjgl-tinyfd:${lwjglTinyFd}:${classifier}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_api_version", project.fabric_api_version

    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "fabric_api_version": project.fabric_api_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion

    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
